# coturn native untuk dev LMS Kampus (tanpa Docker).
# Pasangan docker-compose.yml service coturn, tapi memakai TURN REST API
# (time-limited credential) — kredensial dibuat backend per user per meeting.
# Cara pakai: sudo cp docker/turnserver-native.conf /etc/turnserver.conf
# (ganti CHANGE_ME dengan secret yang sama dengan TURN_REST_SECRET di .env),
# lalu: sudo systemctl restart coturn  ATAU  turnserver -c /etc/turnserver.conf
listening-port=3478
listening-ip=0.0.0.0
# Relay via loopback agar konsisten dengan localhost port-forwarding WSL.
# Client dipaksa memakai TURN/TCP sehingga media mengalir lewat koneksi TCP
# 3478 (yang terbukti ter-forward) bukan via port UDP relay.
relay-ip=127.0.0.1
realm=lms-kampus
# Auth dinamis ala Google Meet: backend menerbitkan username/password
# berumur pendek (HMAC-SHA1 dari static-auth-secret).
use-auth-secret
static-auth-secret=CHANGE_ME_REPLACE_WITH_TURN_REST_SECRET
# Dev lokal tanpa TLS; produksi wajib TLS (tls-listening-port + cert).
no-tls
no-dtls
# WAJIB untuk topologi ini: LiveKit (satu host, via 127.0.0.1) mengirim media
# ke relay socket, dan coturn default menolak peer loopback (403 Forbidden IP).
allow-loopback-peers
# Syarat coturn: allow-loopback-peers hanya boleh aktif bila CLI berpassword.
# CLI hanya listen di loopback (5766), aman untuk dev lokal.
cli-password=lms-cli-local-dev
# Batas wajar untuk kelas besar.
total-quota=300
bps-capacity=0
log-file=/var/log/turnserver.log
simple-log
